[package]
name = "osirs"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = "0.9"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"

[[bin]]
name = "osirs"
test = true
bench = false

[package.metadata.bootimage]
test-success-exit-code = 33
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio"]
test-timeout = 18
