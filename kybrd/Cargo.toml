[package]
name = "osirs"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = "0.9"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
spin = { version = "0.9", features = ["once"]}

[[bin]]
name = "osirs"
test = true
bench = false

[package.metadata.bootimage]
test-success-exit-code = 33
test-args = ["-display", "none", "-serial", "stdio", "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04"]
test-timeout = 10

